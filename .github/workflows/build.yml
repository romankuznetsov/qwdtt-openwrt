# One repository, three things to build: the Go client, the OpenWrt packages
# that wrap it, and the standalone tarballs that predate them. Publishing is
# release.yml, which calls this workflow and acts on the artifacts it leaves.
#
# The jobs are split by cost rather than by product.
#
#   check, client      ~1 min, every push
#   packages           ~8 min, only when a package directory changed
#   client-packages    ~6 min per architecture, tags and dispatch only
#
# The SDK arrives already unpacked, from the images sdk-images.yml publishes,
# so a job no longer opens by downloading it. Most of what is left is the
# kernel build that +kmod-tun pulls in.
---
name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml on a tag. Inside a called workflow github.ref and
  # github.event_name are the CALLER's, which is what the tag conditions below
  # rely on to still fire.
  workflow_call:

permissions:
  contents: read

# Two pushes in quick succession would otherwise pay for two full builds, and
# the first result is stale the moment the second lands. Tag runs opt out of
# cancellation entirely, since a half-run release job is worse than a redundant
# one. The group is spelled out rather than built from github.workflow, which
# inside a called workflow is the caller's name: one shared expression would let
# a release cancel its own build.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GO_VERSION: "1.26.x"

jobs:
  # Most of the pipeline is wasted on a docs-only change. Diff it here and let
  # the build jobs gate on the result: `code` guards the Go check and client
  # build, `packages` guards the SDK packages. Tags and dispatches always
  # build, so a release is never gated on a diff.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.decide.outputs.code }}
      packages: ${{ steps.decide.outputs.packages }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide what needs building
        id: decide
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] ||
             [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
            echo "tag or manual run: building everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "packages=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main takes pull requests only, so gating pushes alone would gate
          # almost nothing: every change now arrives as a pull request.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # A new branch reports an all-zero before, and a force-push can name
          # a commit that no longer exists. Neither is a diff we can trust.
          for commit in "$base" "$head"; do
            if [ -z "$commit" ] ||
               [ "$commit" = "0000000000000000000000000000000000000000" ] ||
               ! git cat-file -e "$commit^{commit}" 2>/dev/null; then
              echo "no usable commit '$commit': building everything"
              echo "code=true" >> "$GITHUB_OUTPUT"
              echo "packages=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Three dots: what the branch added, not what main did meanwhile.
            changed=$(git diff --name-only "$base...$head")
          else
            changed=$(git diff --name-only "$base" "$head")
          fi
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          if echo "$changed" |
             grep -qE '^client/|^\.github/(workflows|scripts)/|^build\.sh$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi
          # Wider than the package directories: the feed generator, its target
          # map and the installer are only exercised by a release otherwise, so
          # a break in them surfaces with a tag pushed rather than on the PR.
          if echo "$changed" |
             grep -qE '^(qwdtt|luci-app-qwdtt|qwdtt-client|assets|keys)/|^\.github/(workflows|scripts)/|^\.github/openwrt-targets\.json$|^(install|build)\.sh$'; then
            echo "packages=true" >> "$GITHUB_OUTPUT"
          else
            echo "packages=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      # Meaningful only because .gitattributes checks the tree out with LF: on
      # a CRLF checkout gofmt reports every file and the gate says nothing.
      - name: gofmt
        working-directory: client
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      # -tags=openwrt on both: without it the wrong raw-socket implementation
      # is selected, so an untagged run checks code the release never builds.
      - name: vet
        working-directory: client
        run: go vet -tags=openwrt ./...

      - name: test
        working-directory: client
        run: go test -tags=openwrt ./...

  client:
    name: client ${{ matrix.name }}
    needs: [changes, check]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            goarch: amd64
          - name: aarch64
            goarch: arm64
          - name: armv7
            goarch: arm
            goarm: "7"
          - name: mipsel
            goarch: mipsle
            gomips: softfloat
          - name: mips
            goarch: mips
            gomips: softfloat

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      # Into dist/ and not the repository root: qwdtt-client is a package
      # directory now, so `-o ../qwdtt-client` would be writing over it.
      - name: Build static client
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: go build -tags=openwrt -trimpath -ldflags="-s -w" -o ../dist/qwdtt-client .

      # The binary and its licence, nothing else. The archive used to carry an
      # installer and a files/ tree, but those shipped a second /etc/init.d/qwdtt
      # and /etc/config/qwdtt on a UCI schema the LuCI page does not use, so the
      # two install paths contradicted each other. Packages are the install
      # path now; this is for dropping the binary somewhere by hand.
      - name: Pack archive
        run: |
          cp LICENSE dist/
          tar -C dist -czf "qwdtt-openwrt-${{ matrix.name }}.tar.gz" \
            qwdtt-client LICENSE

      - name: Upload archive
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.name }}
          path: qwdtt-openwrt-${{ matrix.name }}.tar.gz
          if-no-files-found: error
          retention-days: 90

  packages:
    name: packages ${{ matrix.label }}
    needs: [changes, check]
    if: needs.changes.outputs.packages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # The reason for two entries is the package FORMAT rather than the
          # architecture: OpenWrt replaced opkg with apk, so 24.10 emits .ipk
          # and 25.12 emits .apk from identical sources. Both packages here set
          # PKGARCH:=all, so one architecture serves every target.
          #
          # Both pinned to a release, which is what makes a red build mean
          # something: on snapshot an upstream break and a break of ours are
          # indistinguishable.
          - label: 24.10 (ipk)
            arch: x86_64-24.10.8
          - label: 25.12 (apk)
            arch: x86_64-25.12.5

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      # qwdtt depends on qwdtt-client, so the SDK builds that here too and needs
      # its binary staged. Both SDKs in this matrix are x86_64.
      - name: Cross-compile and stage the client
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -tags=openwrt -trimpath -ldflags="-s -w" -o ../qwdtt-client/files/qwdtt-client .

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with the OpenWrt SDK
        # Pinned, not @main. The action's entrypoint decides how the feed is
        # wired, which packages are built and where the output lands, so
        # tracking its default branch means an upstream commit can change this
        # build without anything here changing. build.sh pins the same tag,
        # because a green local build and a green CI run are only the same
        # statement while both run the same entrypoint.
        uses: openwrt/gh-action-sdk@v11
        env:
          # Our own image rather than ghcr.io/openwrt/sdk, because the
          # published ones unpack the SDK at container start instead of
          # shipping it. See .github/workflows/sdk-images.yml.
          CONTAINER: ghcr.io/${{ github.repository }}/sdk
          ARCH: ${{ matrix.arch }}
          FEEDNAME: qwdtt
          # qwdtt-client is not named here, but qwdtt depends on it, so the SDK
          # builds it anyway. The upload below drops it: client-packages is
          # what publishes it, once per architecture.
          #
          # Only source packages are named. PACKAGES becomes
          # `make package/<name>/download`, so each entry must be a package
          # DIRECTORY -- and luci-i18n-qwdtt-ru is not one. luci.mk defines it
          # from the app's own Makefile by scanning po/*, so listing it fails
          # with "No rule to make target". Building luci-app-qwdtt emits it;
          # the next step asserts that.
          PACKAGES: luci-app-qwdtt qwdtt

      - name: Show what was produced
        run: |
          # The parentheses matter. Without them find reads this as
          #   ( -name '*.ipk' ) OR ( -name '*.apk' AND -print )
          # because -o binds looser than the implicit AND, so an action written
          # after the -o applies only to the second branch.
          find bin -type f \( -name '*.ipk' -o -name '*.apk' \) -print | sort
          for want in luci-app-qwdtt luci-i18n-qwdtt-ru qwdtt; do
            n=$(find bin/packages -type f \
                  \( -name "$want*.ipk" -o -name "$want*.apk" \) | wc -l)
            echo "$want: $n"
            test "$n" -gt 0 || { echo "$want was not produced"; exit 1; }
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.arch }}
          # Only our own. The SDK also builds ~100 dependency packages into
          # bin/, and a wider glob would bury the files anybody wants.
          path: |
            bin/packages/*/qwdtt/*.ipk
            bin/packages/*/qwdtt/*.apk
            !bin/packages/*/qwdtt/qwdtt-client*
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-${{ matrix.arch }}
          path: logs/
          if-no-files-found: ignore

  client-packages:
    name: client package ${{ matrix.sdk }}
    needs: check
    # Tags only, plus manual dispatch so a packaging change can be proven
    # across every architecture without spending a tag to find out.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        # The binary is architecture-specific, so this needs one build per
        # target -- and once per package format, since 24.10 emits .ipk and
        # 25.12 .apk from the same sources. The first two arches are the
        # routers this is deployed to; the rest are what most consumer
        # hardware runs -- mipsel_24kc covers ramips, mips_24kc the same core
        # big-endian for ath79 and lantiq, arm_cortex-a7 mt7621 and ipq40xx.
        include:
          - sdk: x86_64-25.12.5
            goarch: amd64
          - sdk: aarch64_cortex-a53-25.12.5
            goarch: arm64
          - sdk: arm_cortex-a7_neon-vfpv4-25.12.5
            goarch: arm
            goarm: "7"
          - sdk: mipsel_24kc-25.12.5
            goarch: mipsle
            gomips: softfloat
          - sdk: mips_24kc-25.12.5
            goarch: mips
            gomips: softfloat
          - sdk: x86_64-24.10.8
            goarch: amd64
          - sdk: aarch64_cortex-a53-24.10.8
            goarch: arm64
          - sdk: arm_cortex-a7_neon-vfpv4-24.10.8
            goarch: arm
            goarm: "7"
          - sdk: mipsel_24kc-24.10.8
            goarch: mipsle
            gomips: softfloat
          - sdk: mips_24kc-24.10.8
            goarch: mips
            gomips: softfloat

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: client/go.sum

      - name: Cross-compile and stage the client
        working-directory: client
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
        run: go build -tags=openwrt -trimpath -ldflags="-s -w" -o ../qwdtt-client/files/qwdtt-client .

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@v11
        env:
          CONTAINER: ghcr.io/${{ github.repository }}/sdk
          ARCH: ${{ matrix.sdk }}
          FEEDNAME: qwdtt
          PACKAGES: qwdtt-client

      - name: Show what was produced
        run: |
          find bin -type f \
            \( -name 'qwdtt-client*.ipk' -o -name 'qwdtt-client*.apk' \) -print | sort
          n=$(find bin/packages -type f \
                \( -name 'qwdtt-client*.ipk' -o -name 'qwdtt-client*.apk' \) | wc -l)
          test "$n" -gt 0 || { echo "qwdtt-client was not produced"; exit 1; }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: client-package-${{ matrix.sdk }}
          path: |
            bin/packages/*/qwdtt/qwdtt-client*.ipk
            bin/packages/*/qwdtt/qwdtt-client*.apk
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: logs-client-${{ matrix.sdk }}
          path: logs/
          if-no-files-found: ignore
