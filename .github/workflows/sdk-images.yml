name: SDK images

# Publishes one image per SDK the build uses, with the SDK already unpacked
# inside it. build.yml points gh-action-sdk at these through CONTAINER, and a
# tag it names but this never published fails the build with a pull error.
#
# Both read the same discovery script, so the two lists cannot drift. Run this
# after moving OPENWRT_RELEASES, and after OpenWrt adds an architecture.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/sdk.Dockerfile
      - .github/workflows/sdk-images.yml
      - .github/scripts/openwrt-arches.sh
      - .github/openwrt-targets.json

permissions:
  contents: read
  packages: write

concurrency:
  group: sdk-images
  cancel-in-progress: false

jobs:
  arches:
    name: arches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Discover the package architectures
        id: discover
        run: |
          set -eu
          # The script runs in a pipeline below, where set -e alone would let a
          # failure through as an empty matrix instead of a red job.
          set -o pipefail
          map=.github/openwrt-targets.json
          ipk=$(jq -r '."24.10".version' "$map")
          apk=$(jq -r '."25.12".version' "$map")
          list=$(.github/scripts/openwrt-arches.sh "$ipk" "$apk" | jq -r .sdk)
          printf '%s\n' "$list"
          printf 'matrix=%s\n' "$(printf '%s\n' "$list" | jq -Rcs 'split("\n") | map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  bake:
    name: bake ${{ matrix.sdk }}
    needs: arches
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.arches.outputs.matrix) }}

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bake and push
        run: |
          image=ghcr.io/${{ github.repository }}/sdk:${{ matrix.sdk }}
          # Built from stdin so the context is empty. The Dockerfile copies
          # nothing, and the repository as context is megabytes of upload for
          # no purpose.
          docker build \
            --build-arg "ARCH=${{ matrix.sdk }}" \
            --tag "$image" \
            - < .github/sdk.Dockerfile
          docker push "$image"
          docker image inspect "$image" --format 'unpacked size: {{.Size}} bytes'
